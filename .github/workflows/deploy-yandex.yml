name: Deploy to Yandex Object Storage

# Публичный сайт теперь раздаётся из бакета Yandex Object Storage (через
# Yandex Cloud CDN), а не с Netlify. Netlify остался только ради /admin/
# (Decap CMS пишет туда же, в этот репозиторий). Поэтому любой пуш в main —
# и мой, и коммит из самой админки — должен сам долетать до бакета.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Настроить доступ к Object Storage
        run: |
          aws configure set aws_access_key_id ${{ secrets.YC_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.YC_SECRET_ACCESS_KEY }}
          aws configure set region ru-central1

      # Каждый файл на CDN кэшируется сам по себе, со своим таймером. Раньше
      # это значило, что после деплоя посетителю мог достаться свежий index.html
      # со старым app.js — и сайт открывался пустой страницей.
      #
      # Поэтому css/js уезжают под именами с хэшем коммита (app.eafb9d3.js), а
      # index.html ссылается именно на них. Новый деплой — новые адреса, которых
      # в кэше заведомо нет, так что подмешать старый файл к новому html
      # невозможно. Старые версии из бакета не удаляем: пока у кого-то в кэше
      # лежит предыдущий index.html, он должен найти свой, подходящий ему js.
      - name: Собрать css/js с версией в имени и переписать ссылки
        run: |
          V=${GITHUB_SHA::7}
          for f in css/fonts.css css/styles.css js/config.js js/analytics.js js/app.js; do
            cp "$f" "${f%.*}.$V.${f##*.}"
          done
          sed -i -E "s|(href=\"css/[a-z]+)\.css\"|\1.$V.css\"|g; s|(src=\"js/[a-z]+)\.js\"|\1.$V.js\"|g" index.html
          # Если разметку однажды перепишут и sed промахнётся — лучше свалить
          # деплой здесь, чем выложить html со ссылками в никуда.
          grep -q "js/app\.$V\.js" index.html || { echo "Ссылки в index.html не переписались"; exit 1; }
          grep -nE "css/|js/" index.html

      # Страницы для поисковиков. Робот не исполняет js, а весь контент сайта
      # рисует именно js — в исходном html блок <main> пустой, и индексировать
      # было нечего. Скрипт вписывает туда готовый текст из data/*.json и
      # заодно делает отдельные адреса /episodes/, /merch/, /episode/<слаг>/:
      # всё, что живёт после решётки, поисковик за отдельную страницу не считает.
      #
      # Строго ПОСЛЕ шага с версиями: страницы собираются из уже поправленного
      # index.html, поэтому ссылаются на те же css/js, что и главная.
      #
      # Падает — падает весь деплой, и на сайте остаётся предыдущая версия.
      # Это намеренно: лучше не выложить ничего, чем выложить главную
      # с поломанной разметкой.
      - name: Собрать страницы для поисковиков, robots и sitemap
        run: |
          python3 build/prerender.py
          test -s robots.txt || { echo "robots.txt не собрался"; exit 1; }
          test -s sitemap.xml || { echo "sitemap.xml не собрался"; exit 1; }
          grep -q "<main id=\"app\"><section" index.html || { echo "Предрендер не попал в index.html"; exit 1; }

      # /admin/ намеренно не заливаем: Decap CMS там работает только через
      # Netlify Identity/Git Gateway, на Yandex это просто нерабочая страница —
      # пусть на spotterlive.ru её вообще не будет (404), а не полурабочий обломок.
      #
      # editor/ исключаем из общей синхронизации намеренно: ниже он заливается
      # отдельным шагом по неочевидному адресу, а не по /editor/.
      #
      # assets/views.json тоже не трогаем: этот файл не лежит в git, его раз
      # в сутки пишет отдельный workflow update-views.yml. Без --exclude здесь
      # --delete стирал бы его при каждом обычном деплое до следующего запуска
      # того workflow.
      - name: Залить фото и остальные файлы
        run: |
          aws s3 sync . s3://spotterlive \
            --endpoint-url=https://storage.yandexcloud.net \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "serverless/*" \
            --exclude "editor/*" \
            --exclude "admin/*" \
            --exclude "css/*" \
            --exclude "js/*" \
            --exclude "index.html" \
            --exclude "data/*" \
            --exclude "assets/views.json" \
            --exclude "build/*" \
            --exclude "episodes/*" \
            --exclude "merch/*" \
            --exclude "episode/*" \
            --exclude "robots.txt" \
            --exclude "sitemap.xml" \
            --cache-control "public, max-age=86400"

      # Год кэша безопасен ровно потому, что в имени файла стоит версия:
      # следующий деплой создаст другое имя, а не перезапишет это.
      - name: Залить css/js с версией в имени
        run: |
          V=${GITHUB_SHA::7}
          for f in css/fonts.$V.css css/styles.$V.css; do
            aws s3 cp "$f" "s3://spotterlive/$f" \
              --endpoint-url=https://storage.yandexcloud.net \
              --cache-control "public, max-age=31536000, immutable" \
              --content-type "text/css; charset=utf-8"
          done
          for f in js/config.$V.js js/analytics.$V.js js/app.$V.js; do
            aws s3 cp "$f" "s3://spotterlive/$f" \
              --endpoint-url=https://storage.yandexcloud.net \
              --cache-control "public, max-age=31536000, immutable" \
              --content-type "application/javascript; charset=utf-8"
          done

      # Безверсионные копии — для тех, у кого в кэше остался index.html,
      # выпущенный до перехода на имена с версией: он просит js/app.js, и
      # этот файл должен существовать и быть свежим, а не замороженным на
      # том коммите, когда схему поменяли. Кэш короткий: адрес не меняется,
      # поэтому длинный кэш здесь как раз и создавал бы рассинхрон.
      - name: Залить безверсионные копии css/js
        run: |
          for f in css/fonts.css css/styles.css; do
            aws s3 cp "$f" "s3://spotterlive/$f" \
              --endpoint-url=https://storage.yandexcloud.net \
              --cache-control "public, max-age=300" \
              --content-type "text/css; charset=utf-8"
          done
          for f in js/config.js js/analytics.js js/app.js; do
            aws s3 cp "$f" "s3://spotterlive/$f" \
              --endpoint-url=https://storage.yandexcloud.net \
              --cache-control "public, max-age=300" \
              --content-type "application/javascript; charset=utf-8"
          done

      # Виджет СДЭК — чужой, неизменяемый файл с версией прямо в имени,
      # поэтому кэш на год и никаких безверсионных копий. Лежит в js/vendor,
      # а весь js/* из общей синхронизации исключён — без этого шага файла
      # в бакете просто не будет, и кнопка «выбрать на карте» ничего
      # не откроет.
      - name: Залить виджет СДЭК
        run: |
          for f in js/vendor/*.js; do
            aws s3 cp "$f" "s3://spotterlive/$f" \
              --endpoint-url=https://storage.yandexcloud.net \
              --cache-control "public, max-age=31536000, immutable" \
              --content-type "application/javascript; charset=utf-8"
          done

      # Редактор содержимого. Лежит по адресу со случайным хвостом, а не по
      # /editor/ — чтобы на него не набредали случайно и не индексировали
      # поисковики. Это не защита, и выдавать её за защиту нельзя: сайт
      # статический, и любой пароль в коде страницы виден через «исходный
      # код». Защищать в ней нечего — ни данных, ни ключей внутри нет,
      # а настоящий доступ к репозиторию проверяет GitHub по токену,
      # который каждый приносит свой.
      #
      # Без кэша: редактор правится чаще сайта, и ловить его устаревшую
      # версию из кэша — худшее, что может случиться с инструментом правок.
      # Типы указываем руками: в js редактора кириллица в подсказках, и без
      # явной charset браузер может выбрать кодировку сам — и не ту.
      - name: Залить редактор
        run: |
          aws s3 cp editor/index.html s3://spotterlive/edit-7k3m9q/index.html \
            --endpoint-url=https://storage.yandexcloud.net \
            --cache-control "no-cache" \
            --content-type "text/html; charset=utf-8"
          for f in app.js ui.js; do
            aws s3 cp "editor/$f" "s3://spotterlive/edit-7k3m9q/$f" \
              --endpoint-url=https://storage.yandexcloud.net \
              --cache-control "no-cache" \
              --content-type "application/javascript; charset=utf-8"
          done

      # index.html и данные из админки, наоборот, не кэшируем совсем: они
      # маленькие, а видеть их надо сразу. Именно свежий index.html и решает,
      # какая версия css/js поедет посетителю.
      - name: Залить index.html и данные без кэша
        run: |
          aws s3 cp index.html s3://spotterlive/index.html \
            --endpoint-url=https://storage.yandexcloud.net \
            --cache-control "no-cache" \
            --content-type "text/html; charset=utf-8"
          aws s3 sync data s3://spotterlive/data \
            --endpoint-url=https://storage.yandexcloud.net \
            --delete \
            --cache-control "no-cache" \
            --content-type "application/json; charset=utf-8"

      # Страницы для поисковиков. Заливаются отдельно от общей синхронизации
      # ради двух вещей: явной кодировки в content-type (иначе браузер может
      # выбрать её сам, и кириллица поедет) и короткого кэша — содержимое
      # меняется при каждой правке из редактора.
      #
      # Без --delete намеренно: если выпуск переименуют, его прежний адрес
      # останется живым со старым текстом. Это лучше, чем отдавать 404 по
      # ссылке, которая уже попала в выдачу и к людям в закладки.
      - name: Залить страницы для поисковиков
        run: |
          for dir in episodes merch episode; do
            [ -d "$dir" ] || continue
            aws s3 sync "$dir" "s3://spotterlive/$dir" \
              --endpoint-url=https://storage.yandexcloud.net \
              --cache-control "no-cache" \
              --content-type "text/html; charset=utf-8"
          done
          aws s3 cp robots.txt s3://spotterlive/robots.txt \
            --endpoint-url=https://storage.yandexcloud.net \
            --cache-control "public, max-age=3600" \
            --content-type "text/plain; charset=utf-8"
          aws s3 cp sitemap.xml s3://spotterlive/sitemap.xml \
            --endpoint-url=https://storage.yandexcloud.net \
            --cache-control "public, max-age=3600" \
            --content-type "application/xml; charset=utf-8"
