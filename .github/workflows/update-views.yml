name: Обновить просмотры YouTube

# Раз в сутки спрашивает у YouTube актуальные просмотры (через готовый
# tools/update-views.sh) и кладёт assets/views.json прямо в бакет —
# в git этот файл не коммитим, это просто живой снимок чисел.
on:
  schedule:
    - cron: '5 3 * * *'
  workflow_dispatch:

jobs:
  update-views:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Подготовить .env с ключом YouTube API
        run: echo "youtubeApiKey=${{ secrets.YOUTUBE_API_KEY }}" > .env

      - name: Спросить у YouTube просмотры
        run: |
          chmod +x tools/update-views.sh
          ./tools/update-views.sh

      - name: Настроить доступ к Object Storage
        run: |
          aws configure set aws_access_key_id ${{ secrets.YC_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.YC_SECRET_ACCESS_KEY }}
          aws configure set region ru-central1

      - name: Залить views.json в бакет
        run: |
          aws s3 cp assets/views.json s3://spotterlive/assets/views.json \
            --endpoint-url=https://storage.yandexcloud.net
